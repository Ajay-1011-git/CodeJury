[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codejury"
version = "0.1.0"
description = "Local evidence-based Python repair backend"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi", "uvicorn", "pydantic>=2,<3", "jsonschema>=4", "hypothesis", "PyYAML"]

[project.optional-dependencies]
model = ["mlx-lm; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/codejury"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mac: requires actual native MLX model hardware", "sandbox: requires isolated ARM64 runner"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
