version: stage2.judge-learning.v1
source_manifest: data/manifests/stage1.json
runtime_config: config/stage2_core/runtime.yaml
registry: artifacts/stage2_tools/critic-training/selected-v1/registry.json
ledger: artifacts/stage2_core/critic-episodes
reports:
  - artifacts/stage2_core/critic-episodes/train-v2.json
  - artifacts/stage2_core/critic-episodes/validation-v2.json
seeds: [11, 23]
states_per_base: 2
state_limits: {train: 80, validation: 20}
max_options: 4
minimum_margin: 0.001
recipe:
  pilot_steps: 20
  steps: 100
  save_every: 50
  batch_size: 1
  max_seq_length: 4096
  learning_rate: 0.0001
  grad_checkpoint: true
  seed: 17
  validation_loss_batches: 8
