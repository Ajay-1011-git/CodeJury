# FINAL assessment configuration. Frozen before any final run: inspecting final results and then
# editing this file consumes the set as development data (a new final claim needs a fresh set).
schema: stage2-eval-config.v1
profile: final
split: final_assessment
manifest: data/stage2_tools/manifests/stage2.json
seeds: [11, 23, 37]            # at least 3 declared sampling seeds; the first is the public seed
public_seed: 11
bootstrap: {resamples: 10000, seed: 20261012, confidence: 0.95}
safety_limit_ms: 900000        # 15 minute per-run safety cancel applied by the harness itself
caps: &caps
  output_tokens: 10000
  input_tokens: 100000
  function_executions: 3000
  elapsed_ms: 900000
  learned_candidates: 8
  search_candidates: 48
  audit_mutants: 48
  judge_decisions: 8
regimes:
  token_matched: {matched_on: tokens, caps: *caps, cutoff_ms: 900000}
  # Time-matched: the harness cancels every method at the same wall-clock cutoff; unfinished
  # work counts as unsolved. Token ceilings are the generous schema maxima for every method.
  time_matched: {matched_on: time, caps: *caps, cutoff_ms: 600000}
tools_full: [validate, evaluate, search, audit, investigate]
methods:
  B0: {budget: reference, regime: null, tools: [], training_token_opportunity: 0,
       note: "Raw base, one repair; explicitly unmatched reference"}
  B1: {budget: token_matched, regime: token_matched, tools: [evaluate], training_token_opportunity: 0,
       note: "Trained A with execution feedback"}
  B2: {budget: token_matched, regime: token_matched, tools: [evaluate], training_token_opportunity: 0,
       note: "A sampling/revision, up to 8 learned attempts"}
  B3: {budget: token_matched, regime: token_matched, tools: [validate, evaluate, search, audit, investigate],
       training_token_opportunity: 0, note: "Single trained general agent, identical tools/actions"}
  B4: {budget: token_matched, regime: token_matched, tools: [validate, evaluate, search, audit, investigate],
       training_token_opportunity: 0, note: "Four prompted roles, fixed controller"}
  CJ: {budget: token_matched, regime: token_matched, tools: [validate, evaluate, search, audit, investigate],
       training_token_opportunity: 0, note: "Four trained roles, learned Judge"}
time_matched_methods: [B3, B4, CJ]
ablations: [B-unweighted, B-same-view, Generic-Critic, No-search, No-gap-feedback, Audit-at-end, Fixed-Judge]
primary_comparison: {method: CJ, baseline: B3, regime: token_matched}
false_acceptance_margin: 0.02
